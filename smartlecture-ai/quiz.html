<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartLecture AI — MCQ Quiz</title>
    <meta name="description" content="Interactive AI-generated MCQ Quiz with real-time timers, fluid glass options, and detailed performance grading." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
  </head>
  <body>
    <div class="ambient-background">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="ambient-grid"></div>
    </div>

    <div id="sidebar-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:45;display:none;"></div>

    <div class="app-container">
      <!-- SIDEBAR -->
      <aside class="app-sidebar" id="app-sidebar">
        <div>
          <div class="sidebar-header">
            <a href="index.html" class="sidebar-brand">
              <div class="brand-icon">
                <i data-lucide="brain" style="width: 22px; height: 22px;"></i>
              </div>
              <div>
                <span class="brand-title">SmartLecture</span>
                <span class="brand-tag">AI</span>
              </div>
            </a>
          </div>

          <div class="sidebar-nav">
            <div class="nav-label">Navigation</div>
            <a href="index.html" class="nav-item">
              <i data-lucide="layout-dashboard" class="nav-icon"></i>
              <span>Dashboard</span>
            </a>
            <a href="upload.html" class="nav-item">
              <i data-lucide="upload-cloud" class="nav-icon"></i>
              <span>Upload Lecture</span>
            </a>
            <a href="notes.html" class="nav-item">
              <i data-lucide="book-open" class="nav-icon"></i>
              <span>My Notes</span>
              <span class="badge-pill">24</span>
            </a>
            <a href="quiz.html" class="nav-item active">
              <i data-lucide="file-check-2" class="nav-icon"></i>
              <span>Quiz</span>
              <span class="badge-pill">Live</span>
            </a>
            <a href="analytics.html" class="nav-item">
              <i data-lucide="bar-chart-3" class="nav-icon"></i>
              <span>Analytics</span>
            </a>
            <a href="notes.html?filter=saved" class="nav-item">
              <i data-lucide="star" class="nav-icon"></i>
              <span>Saved</span>
            </a>
            
            <div class="nav-label" style="margin-top: 0.8rem;">Preferences</div>
            <a href="settings.html" class="nav-item">
              <i data-lucide="settings" class="nav-icon"></i>
              <span>Settings</span>
            </a>
          </div>
        </div>

        <div class="sidebar-footer">
          <div class="user-profile-card">
            <div class="user-avatar-wrap">
              <div class="user-avatar">P</div>
              <div class="status-indicator"></div>
            </div>
            <div class="user-details">
              <div class="user-name">Preetham</div>
              <div class="user-subtext">
                <span class="online-dot"></span>
                <span>Student · BCA Sem 6</span>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- MAIN CONTENT WRAPPER -->
      <main class="main-wrapper">
        <header class="app-header">
          <div class="header-left">
            <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" aria-label="Toggle menu">
              <i data-lucide="menu" style="width: 22px; height: 22px;"></i>
            </button>
            <div style="display: flex; align-items: center; gap: 0.6rem;">
              <span style="font-size: 0.95rem; font-weight: 700; color: #fff;">Operating Systems Quiz</span>
              <span style="font-size: 0.75rem; background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan-light); padding: 0.2rem 0.55rem; border-radius: 6px; border: 1px solid rgba(56, 189, 248, 0.25);">
                10 MCQs
              </span>
            </div>
          </div>

          <div class="header-right">
            <!-- Countdown Timer -->
            <div class="quiz-timer-pill">
              <i data-lucide="timer" style="width: 16px; height: 16px;"></i>
              <span id="quiz-timer">15:00</span>
            </div>
            <a href="notes.html" class="btn-glass btn-glass-sm">
              <i data-lucide="x" style="width: 14px; height: 14px;"></i>
              <span>Exit Quiz</span>
            </a>
          </div>
        </header>

        <div class="page-content" style="padding-top: 2rem;">
          <div class="quiz-container">
            <!-- Progress Bar -->
            <div class="quiz-progress-track">
              <div class="quiz-progress-fill" id="quiz-progress-bar" style="width: 10%;"></div>
            </div>

            <!-- Quiz Question Card -->
            <div class="glass-panel quiz-card">
              <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem;">
                <div class="question-kicker" id="quiz-question-number">Question 1 of 10</div>
                <div style="font-size: 0.78rem; color: var(--text-muted); font-weight: 600;" id="quiz-question-topic">
                  Core Fundamentals
                </div>
              </div>

              <h2 class="question-text" id="quiz-question-text">
                What is the primary purpose of an operating system?
              </h2>

              <!-- 4 Options (A, B, C, D) -->
              <div class="quiz-options-list" id="quiz-options-container">
                <!-- Dynamically populated by js/quiz.js -->
              </div>
            </div>

            <!-- Bottom Navigation Bar -->
            <div class="quiz-footer-nav">
              <button class="btn-glass" id="quiz-prev-btn">
                <i data-lucide="chevron-left" style="width: 16px; height: 16px;"></i>
                <span>Previous</span>
              </button>

              <!-- Question Dot Pills 1..10 -->
              <div class="question-pills-row" id="quiz-pills-row">
                <!-- Populated by quiz.js -->
              </div>

              <div style="display: flex; gap: 0.65rem;">
                <button class="btn-primary" id="quiz-next-btn">
                  <span>Next Question</span>
                  <i data-lucide="chevron-right" style="width: 16px; height: 16px;"></i>
                </button>

                <button class="btn-primary" id="quiz-submit-btn" style="display: none; background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);">
                  <i data-lucide="check-circle" style="width: 16px; height: 16px;"></i>
                  <span>Submit Quiz</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/quiz.js"></script>
  </body>
</html>
